<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Select Date & Time – Amovi's Cafe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#e9d5ff,#fbcfe8);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

/* HEADER */
.top-header{
  width:100%;
  max-width:420px;
  text-align:center;
  margin-bottom:18px;
}
.top-header h2{font-size:22px;font-weight:700}
.top-header p{font-size:13px;color:#6b7280}

/* CARD */
.card{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:26px;
  border-radius:22px;
  box-shadow:0 25px 60px rgba(0,0,0,.18);
}

h1{text-align:center;font-size:22px;margin-bottom:6px}
.subtitle{text-align:center;font-size:13px;color:#6b7280;margin-bottom:18px}

label{font-size:14px;font-weight:600;margin-bottom:6px;display:block}

input[type="date"]{
  width:100%;
  padding:11px;
  border-radius:12px;
  border:1.5px solid #d1d5db;
  margin-bottom:18px;
}

/* SLOTS */
.slots{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:20px;
}

.slot{
  padding:10px;
  border-radius:12px;
  border:2px solid #d1d5db;
  font-size:13px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.slot.available{
  background:#dcfce7;
  border-color:#16a34a;
  color:#166534;
}

.slot.booked,
.slot.past{
  background:#fee2e2;
  border-color:#dc2626;
  color:#7f1d1d;
  cursor:not-allowed;
  pointer-events:none;
}

.slot.selected{
  background:#ede9fe;
  border-color:#7c3aed;
  color:#4c1d95;
  font-weight:600;
}

/* BUTTON */
button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="top-header">
  <h2>Amovi's Cafe & Fast Food</h2>
  <p>Moments • Memories • Celebrations</p>
</div>

<div class="card">
  <h1>Select Date & Time</h1>
  <p class="subtitle">Choose your preferred time slot</p>

  <label>Select Date</label>
  <input type="date" id="datePicker">

  <label>Select Time Slot</label>
  <div class="slots" id="slotContainer"></div>

  <button onclick="continueBooking()">Continue</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBymiTjjqUN-AAspzoA_bOGUWOzEc9o3jA",
  authDomain: "amovis-cafe-booking.firebaseapp.com",
  projectId: "amovis-cafe-booking",
});
const db = firebase.firestore();

/* ALL TIME SLOTS (start time important) */
const ALL_SLOTS = [
 {label:"09:30 AM – 11:30 AM", start:"09:30"},
 {label:"12:00 PM – 02:00 PM", start:"12:00"},
 {label:"03:00 PM – 05:00 PM", start:"15:00"},
 {label:"05:30 PM – 07:30 PM", start:"17:30"},
 {label:"08:15 PM – 10:00 PM", start:"20:15"}
];

let selectedSlot = "";

document.getElementById("datePicker").addEventListener("change", loadSlots);

async function loadSlots(){
  const dateISO = datePicker.value;
  if(!dateISO) return;

  selectedSlot = "";
  slotContainer.innerHTML = "";

  const todayISO = new Date().toISOString().split("T")[0];
  const now = new Date();

  let bookedSlots = [];

  const snap = await db
    .collection("bookings")
    .where("date","==",dateISO)
    .get();

  bookedSlots = snap.docs.map(d => d.data().timeSlot);

  ALL_SLOTS.forEach(slot=>{
    const div = document.createElement("div");
    div.innerText = slot.label;

    let isPast = false;

    if(dateISO === todayISO){
      const [h,m] = slot.start.split(":");
      const slotTime = new Date();
      slotTime.setHours(h, m, 0, 0);
      if(now >= slotTime) isPast = true;
    }

    if(bookedSlots.includes(slot.label)){
      div.className = "slot booked";
    }
    else if(isPast){
      div.className = "slot past";
    }
    else{
      div.className = "slot available";
      div.onclick = ()=>{
        document.querySelectorAll(".slot").forEach(s=>s.classList.remove("selected"));
        div.classList.add("selected");
        selectedSlot = slot.label;
      };
    }

    slotContainer.appendChild(div);
  });
}

function continueBooking(){
  if(!datePicker.value || !selectedSlot){
    alert("Please select date and time slot");
    return;
  }

  localStorage.setItem("date", datePicker.value);
  localStorage.setItem("timeSlot", selectedSlot);

  window.location.href = "details.html";
}
</script>

</body>
</html>
