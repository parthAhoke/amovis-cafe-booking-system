<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login – Amovi's Cafe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:linear-gradient(135deg,#e9d5ff,#fbcfe8);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
      background:#fff;
      width:100%;
      max-width:380px;
      padding:30px;
      border-radius:22px;
      box-shadow:0 25px 60px rgba(0,0,0,0.2);
      text-align:center;
    }

    h1{
      font-size:22px;
      margin-bottom:6px;
    }

    .subtitle{
      font-size:14px;
      color:#6b7280;
      margin-bottom:22px;
    }

    input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1.5px solid #d1d5db;
      margin-bottom:14px;
      font-size:14px;
    }

    input:focus{
      outline:none;
      border-color:#7c3aed;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      color:white;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      margin-top:10px;
    }

    button:hover{
      opacity:0.9;
    }

    .error{
      color:#dc2626;
      font-size:13px;
      margin-top:10px;
      display:none;
    }

    .brand{
      margin-bottom:18px;
      font-weight:700;
      font-size:18px;
      background:linear-gradient(90deg,#7c3aed,#ec4899);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">Amovi's Cafe & Fast Food</div>

  <h1>Admin Login</h1>
  <p class="subtitle">Authorized access only</p>

  <input type="email" id="email" placeholder="Admin Email" />
  <input type="password" id="password" placeholder="Password" />

  <button onclick="login()">Login</button>

  <p class="error" id="errorMsg">Invalid login</p>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // 🔥 YOUR FIREBASE CONFIG (REPLACE with your project config)
  const firebaseConfig = {
    apiKey: "AIzaSyBymiTjjqUN-AAspzoA_bOGUWOzEc9o3jA",
    authDomain: "amovis-cafe-booking.firebaseapp.com",
    projectId: "amovis-cafe-booking",
    appId: "1:1049074624404:web:35b18f7c0470939257d181"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  function login(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");

    auth.signInWithEmailAndPassword(email,password)
      .then(()=>{
        window.location.href = "admin-dashboard.html";
      })
      .catch(()=>{
        errorMsg.style.display = "block";
      });
  }
</script>

</body>
</html>
